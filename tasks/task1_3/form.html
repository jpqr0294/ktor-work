<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>
    <form action="https://httpbin.io/dump/request" method="POST">
        <p>
        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name">
        </p>
        <p>
        <label for="em">Enter your email:</label>
        <input type="email" id="em" name="email">
        </p>
        <p>
        <label for="date">Enter your date of birth:</label>
        <input type="date" name="date" id="date">
        </p>
        <p>
        <label for="color">Enter your favourite colour:</label>
        <input type="color" name="color" id="color">
        </p>
        <p>Are you student or staff</p>
        <ul>
            <li>
                <label for="student">Student</label>
                <input type="radio" id="student" name="stuStaff" value="student" checked>
            </li>
            <li>
                <label for="staff">Staff</label>
                <input type="radio" id="staff" name="stuStaff" value="staff">
            </li>
        </ul>
        <p>
        <button>Submit</button>
        </p>
    </form>
</body>
</html>
